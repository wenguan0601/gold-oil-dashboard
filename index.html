<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>金价油价自动看板</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f8; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); }
        h1 { color: #333; }
        .price { font-size: 24px; color: #f1c40f; font-weight: bold; }
        .time { color: #888; font-size: 14px; }
    </style>
</head>
<body>
    <div class="card">
        <h1>📊 每日金价油价看板</h1>
        <p>伦敦金: <span class="price">2,650.00</span> USD/oz</p>
        <p>WTI原油: <span class="price">75.20</span> USD/bbl</p>
        <p class="time">最后更新: 2026-11-23 09:59</p>
    </div>
</body>
</html>
